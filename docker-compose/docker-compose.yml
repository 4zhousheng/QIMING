services:
  mysql:
    image: mysql:8.0
    container_name: venus_mysql_instance
    restart: always
    ports:
      - "3307:3306"
    volumes:
      - venus-db-data:/var/lib/mysql
#      - ./mysql/init-scripts:/docker-entrypoint-initdb.d
      - "D:/Desktop/documents/java_projects/Venus_Commerce/docker-compose/mysql/init-scripts:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - venus-network
volumes:
  venus-db-data:
networks:
  venus-network:
